[General]
# Enter the working directory containing your input fasta file
DataDIR=/data/popugen/eDNA/Genestudio_S5/CO1_2025/res

# Enter name of input FASTA file (combined FASTA files)
InputFASTA=R_eWHALE_2025_COI.filtered.fasta

# Choose a 4-character label that will be used in naming of downstream files
Label=JM01

# Choose number of threads for multithreading (default: 1)
Threads=40

# Choose a "d" value for SWARM clustering. Note that d=1 is fastest and recommended by SWARM.
SwarmD=1

# Choose metabarcoding marker (currently 12S or CO1)
#Marker=12S
Marker=CO1

[Ecotag]
# Provide filepaths to reference database (-d) for ecotag
RefDB_12S=/gpfs/eDNA/taxo/taxo_Release_265/taxonomy_october25
RefDB_CO1=/gpfs/eDNA/taxo/taxo_Release_265/taxonomy_october25

# Provide filepaths for reference FASTA file (-R) for ecotag
RefFASTA_12S=/gpfs/eDNA/taxo/taxo_12S_Release_265/genbank_all_pcr_12S_clean_uniq_indexed.fasta
RefFASTA_CO1=/gpfs/eDNA/taxo/taxo_CO1_Release_265/genbank_all_pcr_CO1_clean_uniq_indexed.fasta
